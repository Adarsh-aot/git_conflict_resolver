detect_conflicts_task:
  description: >
    Parse the Git conflict log from {log_file_path}, extract all listed files,
    and scan them for unresolved Git conflict markers.
  expected_output: >
    A list of valid file paths containing '<<<<<<<', '=======', and '>>>>>>>' markers.
  agent: conflict_detector

resolve_conflicts_task:
  description: >
    Resolve each of the files with conflicts using the strategy:
    - If "WEBBAR" exists in only one side, use that.
    - If both or neither have it, prompt the user.
    - If manual editing is chosen, open in VSCode.
  expected_output: >
    All files resolved or marked for manual editing.
  context: [detect_conflicts_task]
  agent: conflict_resolver
  human_input: true

summary_task:
  description: >
    Create a markdown summary of which files were resolved automatically,
    which were resolved by user input, and which were left for manual edits.
  expected_output: >
    A markdown file summarizing resolution outcomes.
  context:
    - detect_conflicts_task
    - resolve_conflicts_task
  agent: summary_reporter
  output_file: output/conflicts.md
