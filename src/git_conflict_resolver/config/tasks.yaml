detect_conflicts_task:
  description: >
    Scan the directory {directory} for all files that have unresolved Git merge conflicts.
    Return a list of file paths that contain the conflict markers <<<<<<<, =======, >>>>>>>.
    If no files are found, return an empty list and skip the next task.
  expected_output: >
    A list of conflicted file paths in the given directory.
  agent: conflict_detector

resolve_conflicts_task:
  description: >
    You are responsible for resolving Git conflicts in the files identified by the previous task.
    You will receive a list of file paths that contain unresolved conflicts.
    For each file, you will:
    - Read the file and identify the conflict markers.
    - Check if the keyword "WEBBAR" is present.
    - If both block contains the keyword, ask the user to choose one of the following options:
      - Options:
        1. Accept current block
        2. Accept incoming block
        3. Accept both blocks
        4. Manually edit the file
    - If the keyword is present in only one of the block, automatically accept the block that has the keyword.
    Apply the user's choice and write the updated content back to the file.
  human_input: true
  expected_output: >
    All files with conflicts resolved and saved back to disk.
  context: [detect_conflicts_task]
  agent: conflict_resolver
  output_file: output/conflicts.md

summary_task:
  description: >
    Generate a summary report that lists:
    - Files resolved automatically (keyword "WEBBAR" found)
    - Files resolved by user input
    Output the summary in a markdown format.
  expected_output: >
    A markdown file summarizing all resolutions, separated by automatic and manual resolutions.
  context:
    - detect_conflicts_task
    - resolve_conflicts_task
  agent: summary_reporter
  output_file: output/conflicts.md
